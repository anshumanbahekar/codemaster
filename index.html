<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="codemaster — developer typing race with 6 AI agents, Firebase leaderboard, 5 themes, 50+ real code snippets" />
    <title>codemaster</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #0d1117; }
      body {
        display: flex; align-items: flex-start; justify-content: center;
        padding: 24px 16px 48px; min-height: 100vh;
        font-family: 'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
      }
      #root { width: 100%; max-width: 740px; }
      button { font-family: inherit; cursor: pointer; }
      button:hover { opacity: 0.82; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #0d1117; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
